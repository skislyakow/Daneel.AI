[project]
name = "daneel-ai"
version = "0.1.0"
description = "Daneel.AI — локальный автономный ИИ-агент"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.28.1",
    "pyperclip>=1.11.0",
    "textual>=8.2.8",
]

[project.scripts]
daneel = "main:main"

[build-system]
requires = ["hatchling>=1.33"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["main.py", "daneel"]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
